name: plataforma_qr_cursor

services:
  mongo:
    image: mongo:7.0
    container_name: 'mongo_qr'
    volumes:
      - mongodb_data_container:/data/db
    environment:
      - MONGO_INITDB_DATABASE=sistema
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      # SPEC-023: nombre de la BD del blog (qr-cms / Payload CMS) — la lee mongo-init.js
      - CMS_DB_NAME=portaqr_cms
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok' --port 27017 -u "root" -p "example" --authenticationDatabase "admin"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "27017:27017"
    networks:
      - webnet

  mongo-express:
    image: mongo-express
    container_name: mongo-express_qr
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=example
      - ME_CONFIG_MONGODB_SERVER=mongo_qr
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
      - ME_CONFIG_MONGODB_RETRY_CONNECTIONS=true
      - ME_CONFIG_MONGODB_RETRY_CONNECTIONS_COUNT=10
      - ME_CONFIG_MONGODB_RETRY_CONNECTIONS_INTERVAL=5000
    depends_on:
      - mongo
    networks:
      - webnet
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8081 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  backend-portaqr:
    build:
      context: ./backend-portaqr
      target: development
      dockerfile: Dockerfile
    container_name: backend-portaqr
    restart: always
    ports:
      - "3004:3004"
    env_file:
      - ./backend-portaqr/backendPortaqr.env
    environment:
      - SERVER_PORT=3004
    volumes:
      - ./backend-portaqr:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - webnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVICIOS DEPRECADOS (monolito modular pre-SPEC-001) — COMENTADOS
  # SPEC-001 migró toda la lógica a `backend-portaqr` (puerto 3004, único
  # backend activo). user-service / bff-service / qr-service ya NO se usan:
  #   - `qr-app` apunta a `NEXT_PUBLIC_BFF_URL=http://backend-portaqr:3004`
  #     (depends_on actualizado más abajo — antes esperaba a bff-service).
  #   - bff-service además crasheaba (SIGSEGV en nest start --watch).
  # Para reactivar temporalmente (NO recomendado): quitar los `#` del bloque.
  # ═══════════════════════════════════════════════════════════════════════════

  # user-service (DEPRECADO — SPEC-001):
  # user-service:
  #   build:
  #     context: ./user-service
  #     target: development
  #     dockerfile: Dockerfile
  #   container_name: user-service
  #   restart: always
  #   ports:
  #     - "3002:3002"
  #   env_file:
  #     - ./user-service/userService.env
  #   volumes:
  #     - ./user-service:/app
  #     - /app/node_modules
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   networks:
  #     - webnet
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   command: npm run dev
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   environment:
  #     - SERVER_PORT=3002

  # bff-service (DEPRECADO — SPEC-001/SPEC-003):
  # bff-service:
  #   build:
  #     context: ./bff-service
  #     target: development
  #     dockerfile: Dockerfile
  #   container_name: bff-service
  #   restart: always
  #   ports:
  #     - "3001:3001"
  #   env_file:
  #     - ./bff-service/bffService.env
  #   environment:
  #     - SERVER_PORT=3001
  #     - USER_SERVICE_URL=http://user-service:3002
  #   volumes:
  #     - ./bff-service:/app
  #     - /app/node_modules
  #   depends_on:
  #     user-service:
  #       condition: service_healthy
  #   networks:
  #     - webnet
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   command: npm run dev
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  qr-app:
    build:
      context: ./qr-app
      target: development
      dockerfile: Dockerfile
    container_name: qr-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./qr-app/qrApp.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BFF_URL=http://backend-portaqr:3004
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - ./qr-app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      # SPEC-001/005: antes esperaba a bff-service (deprecado). Ahora espera al
      # backend real (el frontend reenvía a backend-portaqr:3004 vía API routes).
      backend-portaqr:
        condition: service_healthy
    networks:
      - webnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SPEC-027 (prueba local): build+start reproduce el fix de /blog/categoria/[slug]
    # (dev no prerenderiza). NODE_ENV=production es OBLIGATORIO: con development,
    # next build falla prerenderizando páginas estáticas (useContext/useReducer null).
    # Revertir a `npm run dev` tras la prueba.
    command: sh -c "npm install && NODE_ENV=production npm run build && NODE_ENV=production npm start"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════════════════
  # qr-cms — Payload CMS 3.x + Next.js (blog PortaQR, SPEC-023)
  # App separada del blog público. Admin + REST/GraphQL API. BD portaqr_cms
  # (misma instancia mongo) + imágenes en Cloudflare R2.
  # El blog público (qr-app) consume la REST API con ISR.
  # ═══════════════════════════════════════════════════════════════════════════
  qr-cms:
    build:
      context: ./qr-cms
      target: development
      dockerfile: Dockerfile
    container_name: qr-cms
    restart: always
    ports:
      - "3005:3005"
    env_file:
      - ./qr-cms/qrCms.env
    environment:
      - SERVER_PORT=3005
      - PORT=3005 # Next.js usa PORT (no SERVER_PORT) para el puerto de escucha
    volumes:
      - ./qr-cms:/app
      - /app/node_modules
      - ./qr-cms/media:/app/media:rw
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - webnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005/admin || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # qr-service (DEPRECADO — SPEC-001):
  # qr-service:
  #   build:
  #     context: ./qr-service
  #     target: development
  #     dockerfile: Dockerfile
  #   container_name: qr-service
  #   restart: always
  #   ports:
  #     - "3003:3003"
  #   env_file:
  #     - ./qr-service/qrService.env
  #   environment:
  #     - SERVER_PORT=3003
  #     - USER_SERVICE_URL=http://user-service:3002
  #   volumes:
  #     - ./qr-service:/app
  #     - /app/node_modules
  #   depends_on:
  #     user-service:
  #       condition: service_healthy
  #   networks:
  #     - webnet
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   command: npm run dev
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

networks:
  webnet:
    driver: bridge

volumes:
  mongodb_data_container:
    name: plataforma_qr_cursor_mongodb_data_container
    external: true